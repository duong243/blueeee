<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue Lock Ultimate - Final 5v5</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; user-select: none; }
    body { background: #111; color: white; overflow: hidden; width: 100vw; height: 100vh; }
    
    #game-container { position: absolute; inset: 0; z-index: 1; }
    
    /* UI Lobby */
    #lobby { position: absolute; inset: 0; background: linear-gradient(135deg, #1e3c72, #2a5298); z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .btn { background: #ff416c; color: white; font-size: 20px; padding: 15px 40px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin: 10px; transition: 0.2s; }
    .btn:hover { transform: scale(1.05); }
    
    /* HUD */
    #hud { position: absolute; inset: 0; pointer-events: none; z-index: 5; display: none; }
    .scoreboard { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 10px 30px; border-radius: 10px; font-size: 28px; font-weight: bold; border: 2px solid #ffaa00; }
    #notify { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); color: #ffaa00; font-size: 50px; font-weight: bold; text-shadow: 2px 2px 4px black; display: none; }
    
    /* Thanh Lực */
    #powerBar-container { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); width: 300px; height: 20px; background: rgba(0,0,0,0.5); border: 2px solid white; border-radius: 10px; display: none; }
    #powerBar { width: 0%; height: 100%; background: linear-gradient(90deg, #00ff00, #ffff00, #ff0000); border-radius: 8px; }
    #shot-type { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); font-size: 24px; font-weight: bold; color: #00ffff; display: none; text-shadow: 1px 1px 2px black; }
    
    /* Test Thẻ */
    #test-btns { position: absolute; bottom: 20px; left: 20px; display: flex; gap: 10px; }
    #test-btns button { background: #ffaa00; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; color: black; }
    
    /* Card Modal */
    #card-modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.95); padding: 40px 80px; border-radius: 20px; border: 4px solid #fff; z-index: 999; display: none; text-align: center; }
    #card-modal h1 { font-size: 60px; margin-bottom: 10px; }
    .yellow { color: #ffcc00; }
    .red { color: #ff0000; text-shadow: 0 0 20px #ff0000; }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <!-- LOBBY -->
  <div id="lobby">
    <h1 style="margin-bottom:20px;">BLUE LOCK ULTIMATE</h1>
    <input type="text" id="playerName" placeholder="Nhập tên của bạn..." style="padding:10px; border-radius:5px; border:none; margin-bottom:20px; text-align:center;">
    <button class="btn" onclick="startGame('training')">Tập Luyện (1 Người)</button>
    <button class="btn" onclick="startGame('rank')">Đá Trận (5v5 AI)</button>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="scoreboard" id="scoreboard">🔵 0 - 0 🔴</div>
    <div id="notify">BÓNG RA NGOÀI!</div>
    
    <div id="shot-type">SÚT THƯỜNG</div>
    <div id="powerBar-container"><div id="powerBar"></div></div>

    <div id="test-btns">
      <button onclick="showCard('yellow')">Rút Thẻ Vàng</button>
      <button onclick="showCard('red')">Rút Thẻ Đỏ</button>
    </div>

    <div id="card-modal">
      <h1 id="card-title">THẺ VÀNG</h1>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';

    // ===== BIẾN TOÀN CỤC =====
    let scene, camera, renderer;
    let player, ball, goalkeeper;
    let playerLegs = [], playerArms = [], gkArms = [];
    let aiPlayers = []; // Mảng chứa AI: { mesh, team, legs, arms }
    
    let keys = {};
    let isPlaying = false;
    let lastTime = 0;
    let score = { blue: 0, red: 0 };
    let gameMode = 'training';
    
    // Vật lý
    const ballPhysics = { velocity: new THREE.Vector3(), radius: 0.4, isControlled: false, gravity: -25 };
    const PLAYER_OFFSET_Y = 1.8; // Nâng nhân vật lên để không lọt đất

    // Sút
    let isCharging = false;
    let chargePower = 0;

    // ===== KHỞI TẠO =====
    window.startGame = function(mode) {
      const nameInput = document.getElementById('playerName').value.trim();
      if (!nameInput) return alert("Vui lòng nhập tên!");
      
      gameMode = mode;
      document.getElementById('lobby').style.display = 'none';
      document.getElementById('hud').style.display = 'block';
      
      isPlaying = true;
      init3D(nameInput);
      animate();
    };

    function init3D(playerName) {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb);
      scene.fog = new THREE.Fog(0x87ceeb, 50, 200);
      
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      document.getElementById('game-container').appendChild(renderer.domElement);

      // Ánh sáng
      scene.add(new THREE.AmbientLight(0xffffff, 0.8));
      const sun = new THREE.DirectionalLight(0xffffff, 1);
      sun.position.set(50, 100, 50); sun.castShadow = true; scene.add(sun);

      // Sân bóng
      const grass = new THREE.Mesh(new THREE.PlaneGeometry(100, 140), new THREE.MeshStandardMaterial({ color: 0x2d8a2d }));
      grass.rotation.x = -Math.PI / 2; grass.receiveShadow = true; scene.add(grass);
      
      // Vạch kẻ
      const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      function addLine(x, z, w, l) {
        const line = new THREE.Mesh(new THREE.PlaneGeometry(w, l), lineMat);
        line.rotation.x = -Math.PI / 2; line.position.set(x, 0.01, z); scene.add(line);
      }
      addLine(0, 0, 100, 0.4); addLine(-50, 0, 0.4, 140); addLine(50, 0, 0.4, 140); addLine(0, -70, 100, 0.4); addLine(0, 70, 100, 0.4);
      
      // Khung thành
      function createGoal(zPos) {
        const group = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const p1 = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 6), mat); p1.position.set(-10, 3, 0); group.add(p1);
        const p2 = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 6), mat); p2.position.set(10, 3, 0); group.add(p2);
        const p3 = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 20), mat); p3.rotation.z = Math.PI/2; p3.position.set(0, 6, 0); group.add(p3);
        group.position.z = zPos; return group;
      }
      scene.add(createGoal(-70)); scene.add(createGoal(70));

      // Hàm tạo nhân vật Minecraft Style
      function buildCharacter(color, isGK = false) {
        const pGroup = new THREE.Group();
        const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac }); 
        const bodyMat = new THREE.MeshStandardMaterial({ color: color }); 
        const limbMat = new THREE.MeshStandardMaterial({ color: 0x1a5c1a });

        const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), skinMat); head.position.y = 2.4; head.castShadow = true; pGroup.add(head);
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.2, 0.5), bodyMat); body.position.y = 1.4; body.castShadow = true; pGroup.add(body);
        
        const lLeg = new THREE.Group(); lLeg.add(new THREE.Mesh(new THREE.BoxGeometry(0.35, 1, 0.35), limbMat)); lLeg.children[0].position.y = -0.5; lLeg.position.set(-0.25, 0.8, 0); pGroup.add(lLeg);
        const rLeg = new THREE.Group(); rLeg.add(new THREE.Mesh(new THREE.BoxGeometry(0.35, 1, 0.35), limbMat)); rLeg.children[0].position.y = -0.5; rLeg.position.set(0.25, 0.8, 0); pGroup.add(rLeg);
        
        const lArm = new THREE.Group(); lArm.add(new THREE.Mesh(new THREE.BoxGeometry(0.25, 1, 0.25), bodyMat)); lArm.children[0].position.y = -0.5; lArm.position.set(-0.575, 2, 0); pGroup.add(lArm);
        const rArm = new THREE.Group(); rArm.add(new THREE.Mesh(new THREE.BoxGeometry(0.25, 1, 0.25), bodyMat)); rArm.children[0].position.y = -0.5; rArm.position.set(0.575, 2, 0); pGroup.add(rArm);

        return { group: pGroup, legs: [lLeg, rLeg], arms: [lArm, rArm] };
      }

      // 1. TẠO NGƯỜI CHƠI
      const pChar = buildCharacter(0x0066ff);
      player = pChar.group;
      player.position.set(0, PLAYER_OFFSET_Y, 20);
      scene.add(player);
      playerLegs = pChar.legs; playerArms = pChar.arms;

      // Bảng tên người chơi
      addNameTag(player, playerName, "#ffffff");

      // 2. TẠO THỦ MÔN (Áo đỏ)
      const gkChar = buildCharacter(0xff0000, true);
      goalkeeper = gkChar.group;
      goalkeeper.position.set(0, PLAYER_OFFSET_Y, -65);
      scene.add(goalkeeper);
      gkArms = gkChar.arms;

      // 3. TẠO AI NẾU LÀ CHẾ ĐỘ 5V5
      aiPlayers = [];
      if (gameMode === 'rank') {
        // 4 Đồng đội (Xanh)
        for (let i = 0; i < 4; i++) {
          const ally = buildCharacter(0x0066ff);
          ally.group.position.set(Math.random() * 40 - 20, PLAYER_OFFSET_Y, Math.random() * 40 + 10);
          scene.add(ally.group);
          aiPlayers.push({ mesh: ally.group, team: 'blue', legs: ally.legs, arms: ally.arms });
        }
        // 5 Đối thủ (Đỏ)
        for (let i = 0; i < 5; i++) {
          const enemy = buildCharacter(0xff0000);
          enemy.group.position.set(Math.random() * 40 - 20, PLAYER_OFFSET_Y, Math.random() * -40 - 10);
          scene.add(enemy.group);
          aiPlayers.push({ mesh: enemy.group, team: 'red', legs: enemy.legs, arms: enemy.arms });
        }
      }

      // 4. BÓNG
      ball = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffffff }));
      ball.castShadow = true; ball.position.set(0, 0.4, 0); scene.add(ball);

      // Bắt sự kiện phím
      document.addEventListener('keydown', e => { if(isPlaying) keys[e.code] = true; });
      document.addEventListener('keyup', e => keys[e.code] = false);

      lastTime = performance.now();
    }

    // Hàm tạo bảng tên
    function addNameTag(mesh, name, color) {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0,0,256,64);
      ctx.fillStyle = color; ctx.font = 'bold 24px Arial'; ctx.textAlign = 'center'; ctx.fillText(name, 128, 40);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas) }));
      sprite.scale.set(4, 1, 1); sprite.position.y = 3.5;
      mesh.add(sprite);
    }

    // ===== VÒNG LẶP GAME =====
    function animate() {
      if (!isPlaying) return;
      requestAnimationFrame(animate);
      
      const now = performance.now();
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      updatePlayer(dt, now);
      updateGoalkeeper(dt);
      updateAI(dt, now);
      updateBall(dt);
      updateCamera();
      checkOutOfBounds();

      renderer.render(scene, camera);
    }

    // CẬP NHẬT NGƯỜI CHƠI & SÚT
    function updatePlayer(dt, now) {
      const speed = 15;
      const dir = new THREE.Vector3();
      if (keys['KeyW']) dir.z -= 1; if (keys['KeyS']) dir.z += 1; if (keys['KeyA']) dir.x -= 1; if (keys['KeyD']) dir.x += 1;
      
      // Di chuyển
      if (dir.length() > 0 && !isCharging) {
        dir.normalize();
        player.position.x += dir.x * speed * dt;
        player.position.z += dir.z * speed * dt;
        player.rotation.y = THREE.MathUtils.lerp(player.rotation.y, Math.atan2(dir.x, dir.z), 0.2);
        
        // Animation chạy
        const swing = Math.sin(now * 0.015) * 0.8;
        playerLegs[0].rotation.x = swing; playerLegs[1].rotation.x = -swing;
        playerArms[0].rotation.x = -swing; playerArms[1].rotation.x = swing;
      } else {
        playerLegs[0].rotation.x = THREE.MathUtils.lerp(playerLegs[0].rotation.x, 0, 0.1);
        playerLegs[1].rotation.x = THREE.MathUtils.lerp(playerLegs[1].rotation.x, 0, 0.1);
        playerArms[0].rotation.x = THREE.MathUtils.lerp(playerArms[0].rotation.x, 0, 0.1);
        playerArms[1].rotation.x = THREE.MathUtils.lerp(playerArms[1].rotation.x, 0, 0.1);
      }

      // Giới hạn sân
      player.position.x = THREE.MathUtils.clamp(player.position.x, -48, 48);
      player.position.z = THREE.MathUtils.clamp(player.position.z, -68, 68);

      // Xử lý dính bóng
      const dist = new THREE.Vector2(ball.position.x - player.position.x, ball.position.z - player.position.z).length();
      if (!ballPhysics.isControlled && dist < 1.5 && ball.position.y < 1) {
        ballPhysics.isControlled = true;
      }
      
      // Xử lý SÚT
      if (ballPhysics.isControlled) {
        const fwd = new THREE.Vector3(Math.sin(player.rotation.y), 0, Math.cos(player.rotation.y));
        ball.position.lerp(player.position.clone().add(fwd.multiplyScalar(1)).setY(0.4), 0.3);
        
        if (keys['KeyJ'] && !isCharging) {
          isCharging = true; chargePower = 0;
          document.getElementById('powerBar-container').style.display = 'block';
        }
        
        if (isCharging) {
          chargePower = Math.min(1, chargePower + dt * 1.5);
          document.getElementById('powerBar').style.width = (chargePower * 100) + '%';
          
          // Hiển thị kiểu sút
          const shotText = document.getElementById('shot-type');
          shotText.style.display = 'block';
          if (keys['KeyA'] || keys['KeyD']) { shotText.textContent = "SÚT XOÁY"; shotText.style.color = "#00ffff"; }
          else if (keys['KeyS']) { shotText.textContent = "SÚT SẤM SÉT"; shotText.style.color = "#ff3333"; }
          else if (keys['KeyW']) { shotText.textContent = "SÚT BỔNG"; shotText.style.color = "#ffaa00"; }
          else { shotText.textContent = "SÚT THƯỜNG"; shotText.style.color = "#ffffff"; }

          // Nhả phím J để sút
          if (!keys['KeyJ']) {
            isCharging = false;
            document.getElementById('powerBar-container').style.display = 'none';
            shotText.style.display = 'none';
            
            const finalPower = 20 + (chargePower * 40);
            ballPhysics.isControlled = false;

            if (keys['KeyA'] || keys['KeyD']) {
              const curveDir = keys['KeyA'] ? -1 : 1;
              ballPhysics.velocity.set(fwd.x * finalPower + curveDir * 15, 8, fwd.z * finalPower);
            } else if (keys['KeyS']) {
              ballPhysics.velocity.set(fwd.x * (finalPower * 1.5), 3, fwd.z * (finalPower * 1.5));
            } else if (keys['KeyW']) {
              ballPhysics.velocity.set(fwd.x * (finalPower * 0.8), 25, fwd.z * (finalPower * 0.8));
            } else {
              ballPhysics.velocity.set(fwd.x * finalPower, 5, fwd.z * finalPower);
            }
            chargePower = 0;
          }
        }
      }
    }

    // THỦ MÔN AI
    function updateGoalkeeper(dt) {
      // Bám theo trục X của bóng
      const targetX = ball.position.x * 0.5;
      goalkeeper.position.x = THREE.MathUtils.lerp(goalkeeper.position.x, THREE.MathUtils.clamp(targetX, -8, 8), 0.1);
      
      // Bay người nếu bóng tới gần
      if (ball.position.z < -50 && !ballPhysics.isControlled) {
        if (ball.position.x > goalkeeper.position.x) {
          gkArms[1].rotation.z = -Math.PI / 2; gkArms[0].rotation.z = 0;
        } else {
          gkArms[0].rotation.z = Math.PI / 2; gkArms[1].rotation.z = 0;
        }
      } else {
        gkArms[1].rotation.z = THREE.MathUtils.lerp(gkArms[1].rotation.z, 0, 0.1);
        gkArms[0].rotation.z = THREE.MathUtils.lerp(gkArms[0].rotation.z, 0, 0.1);
      }
    }

    // AI CẦU THỦ CHẠY THEO BÓNG
    function updateAI(dt, now) {
      aiPlayers.forEach(ai => {
        const dir = new THREE.Vector3(ball.position.x - ai.mesh.position.x, 0, ball.position.z - ai.mesh.position.z);
        if (dir.length() > 2) {
          dir.normalize();
          ai.mesh.position.x += dir.x * 10 * dt;
          ai.mesh.position.z += dir.z * 10 * dt;
          ai.mesh.rotation.y = THREE.MathUtils.lerp(ai.mesh.rotation.y, Math.atan2(dir.x, dir.z), 0.1);
          
          // Animation AI chạy
          const swing = Math.sin(now * 0.01) * 0.8;
          ai.legs[0].rotation.x = swing; ai.legs[1].rotation.x = -swing;
          ai.arms[0].rotation.x = -swing; ai.arms[1].rotation.x = swing;
        }
      });
    }

    // VẬT LÝ BÓNG
    function updateBall(dt) {
      if (!ballPhysics.isControlled) {
        ballPhysics.velocity.y += ballPhysics.gravity * dt;
        ball.position.x += ballPhysics.velocity.x * dt;
        ball.position.y += ballPhysics.velocity.y * dt;
        ball.position.z += ballPhysics.velocity.z * dt;
        
        // Nảy trên cỏ
        if (ball.position.y < 0.4) {
          ball.position.y = 0.4;
          ballPhysics.velocity.y = -ballPhysics.velocity.y * 0.6;
          ballPhysics.velocity.x *= 0.98; ballPhysics.velocity.z *= 0.98;
        }
      }
    }

    // KIỂM TRA RA NGOÀI / GHI BÀN
    function checkOutOfBounds() {
      if (ballPhysics.isControlled) return;

      // Ghi bàn
      if (ball.position.z < -68 && Math.abs(ball.position.x) < 10) {
        score.blue++; updateScore(); flashScreen(0x00aaff); resetBall();
        return;
      }
      if (ball.position.z > 68 && Math.abs(ball.position.x) < 10) {
        score.red++; updateScore(); flashScreen(0xff3333); resetBall();
        return;
      }

      // Ra ngoài biên dọc
      if (Math.abs(ball.position.x) > 48) {
        showOutNotify(); resetBall();
      }
      // Ra ngoài biên ngang (không vào gôn)
      if (Math.abs(ball.position.z) > 68 && Math.abs(ball.position.x) > 10) {
        showOutNotify(); resetBall();
      }
    }

    function resetBall() {
      ball.position.set(0, 0.4, 0);
      ballPhysics.velocity.set(0,0,0);
      ballPhysics.isControlled = false;
      player.position.set(0, PLAYER_OFFSET_Y, 20);
      
      // Reset AI về vị trí ngẫu nhiên
      aiPlayers.forEach(ai => {
        ai.mesh.position.set(Math.random() * 40 - 20, PLAYER_OFFSET_Y, ai.team === 'blue' ? Math.random() * 40 + 10 : Math.random() * -40 - 10);
      });
    }

    function showOutNotify() {
      const el = document.getElementById('notify');
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 1500);
    }

    function updateScore() {
      document.getElementById('scoreboard').textContent = `🔵 ${score.blue} - ${score.red} 🔴`;
    }

    function updateCamera() {
      const camOffset = new THREE.Vector3(0, 18, 22);
      camera.position.lerp(player.position.clone().add(camOffset), 0.1);
      camera.lookAt(player.position.x, player.position.y, player.position.z);
    }

    function flashScreen(color) {
      const flash = document.createElement('div');
      flash.style.cssText = `position: fixed; inset: 0; background: #${color.toString(16).padStart(6, '0')}; opacity: 0.5; pointer-events: none; z-index: 100; transition: opacity 0.5s;`;
      document.body.appendChild(flash);
      setTimeout(() => flash.style.opacity = '0', 50);
      setTimeout(() => flash.remove(), 600);
    }

    // HIỂN THỊ THẺ
    window.showCard = function(type) {
      const modal = document.getElementById('card-modal');
      const title = document.getElementById('card-title');
      modal.className = ''; 
      
      if (type === 'yellow') {
        modal.classList.add('yellow');
        title.textContent = "THẺ VÀNG ⚠️";
      } else {
        modal.classList.add('red');
        title.textContent = "THẺ ĐỎ 🟥";
      }
      modal.style.display = 'block';
      setTimeout(() => { modal.style.display = 'none'; }, 3000);
    };

  </script>
</body>
</html>
